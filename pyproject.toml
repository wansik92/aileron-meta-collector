[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aileron-meta-collector"
version = "0.1.27"
description = "Automatic DataHub lineage collector via SQLAlchemy and boto3 event hooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "jangwansik" },
]
keywords = [
    "datahub",
    "lineage",
    "metadata",
    "sqlalchemy",
    "boto3",
    "athena",
    "data-catalog",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    "sqlparse>=0.4.0",
    "requests>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/aileron/aileron-meta-collector"
Repository = "https://github.com/aileron/aileron-meta-collector"

[project.optional-dependencies]
# boto3 Athena/S3 훅 사용 환경
boto3 = [
    "boto3>=1.26.0",
]
# SQLAlchemy 훅 사용 환경
sqlalchemy = [
    "SQLAlchemy>=1.4.0",
]
# 전체 설치
all = [
    "boto3>=1.26.0",
    "SQLAlchemy>=1.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "moto[s3,athena]>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
include = [
    "aileron_meta_collector/",
    "tests/",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["aileron_meta_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
